name: Publish Exceler to NuGet

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x' 

      - name: Restore dependencies
        run: dotnet restore src/Exceler/Exceler.csproj 

      - name: Build
        run: dotnet build src/Exceler/Exceler.csproj -c Release --no-restore

      - name: Pack EXACTLY the Exceler project
        run: dotnet pack src/Exceler/Exceler.csproj -c Release --no-build --output ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json